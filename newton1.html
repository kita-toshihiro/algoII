<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ニュートン法 (Newton-Raphson法) アルゴリズム可視化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; }
        canvas { touch-action: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG アイコン
        const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const PauseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
        const RefreshIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
        const ChevronRightIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;

        // プリセット定義
        const PRESETS = {
            cubic_normal: {
                id: 'cubic_normal',
                name: '3次方程式：通常収束',
                badge: '通常収束',
                badgeColor: 'bg-green-100 text-green-800 border-green-300',
                desc: 'f(x) = x³ - 3x + 1, 正の解 ≈ 1.532 へわずか 4 回で高速収束',
                formula: 'f(x) = x^3 - 3x + 1',
                dFormula: "f'(x) = 3x^2 - 3",
                func: (x) => Math.pow(x, 3) - 3 * x + 1,
                dfunc: (x) => 3 * Math.pow(x, 2) - 3,
                defaultX0: 2.0,
                sliderMin: -3.0,
                sliderMax: 3.0,
                view: { xMin: -3, xMax: 3, yMin: -8, yMax: 8 },
                roots: [1.53209, 0.34730, -1.87939]
            },
            cubic_blowup: {
                id: 'cubic_blowup',
                name: '3次方程式：極値付近での吹き飛び',
                badge: '吹き飛び・別解',
                badgeColor: 'bg-amber-100 text-amber-800 border-amber-300',
                desc: 'f(x) = x³ - 3x + 1, x₀ = 0.99 など極値付近で接線が水平に近くなり x₁ ≈ -15.75 へ吹き飛ぶ！',
                formula: 'f(x) = x^3 - 3x + 1',
                dFormula: "f'(x) = 3x^2 - 3",
                func: (x) => Math.pow(x, 3) - 3 * x + 1,
                dfunc: (x) => 3 * Math.pow(x, 2) - 3,
                defaultX0: 0.99,
                sliderMin: -2.0,
                sliderMax: 2.0,
                view: { xMin: -18, xMax: 4, yMin: -18, yMax: 12 },
                roots: [1.53209, 0.34730, -1.87939]
            },
            cubic_zero: {
                id: 'cubic_zero',
                name: '3次方程式：傾きゼロでクラッシュ',
                badge: 'ゼロ除算エラー',
                badgeColor: 'bg-red-100 text-red-800 border-red-300',
                desc: "f(x) = x³ - 3x + 1, 極値 x₀ = 1.0 または -1.0 で f'(x)=0 のため接線が水平になり即死",
                formula: 'f(x) = x^3 - 3x + 1',
                dFormula: "f'(x) = 3x^2 - 3",
                func: (x) => Math.pow(x, 3) - 3 * x + 1,
                dfunc: (x) => 3 * Math.pow(x, 2) - 3,
                defaultX0: 1.0,
                sliderMin: -3.0,
                sliderMax: 3.0,
                view: { xMin: -3, xMax: 3, yMin: -8, yMax: 8 },
                roots: [1.53209, 0.34730, -1.87939]
            },
            sqrt2: {
                id: 'sqrt2',
                name: '平方根 √2（バビロニア法）',
                badge: '絶対収束',
                badgeColor: 'bg-blue-100 text-blue-800 border-blue-300',
                desc: 'f(x) = x² - 2, 凸関数のため正のどんな初期値からも必ず収束するCPUの基本演算',
                formula: 'f(x) = x^2 - 2',
                dFormula: "f'(x) = 2x",
                func: (x) => Math.pow(x, 2) - 2,
                dfunc: (x) => 2 * x,
                defaultX0: 2.0,
                sliderMin: 0.1,
                sliderMax: 4.0,
                view: { xMin: 0, xMax: 3.5, yMin: -3, yMax: 8 },
                roots: [1.41421]
            }
        };

        const NewtonMethod = () => {
            const [selectedPresetKey, setSelectedPresetKey] = useState('cubic_normal');
            const preset = PRESETS[selectedPresetKey];

            // 自由設定可能な初期値
            const [customX0, setCustomX0] = useState(preset.defaultX0);

            // シミュレーション状態
            // step -1: 開始前 (初期値のみ設定)
            // step 0: 初期点 (x0, f(x0)) と最初の接線を描画
            // step 1~: 反復
            const [step, setStep] = useState(-1);
            const [currentX, setCurrentX] = useState(preset.defaultX0);
            const [history, setHistory] = useState([]);
            const [isPlaying, setIsPlaying] = useState(false);
            const [status, setStatus] = useState('ready'); // 'ready', 'running', 'converged', 'zero_slope'

            // Canvas 設定
            const canvasRef = useRef(null);
            const width = 640;
            const height = 400;

            // ユーザー指定の初期値も収まるように view 範囲を調整
            const xMin = Math.min(preset.view.xMin, customX0 - 0.8);
            const xMax = Math.max(preset.view.xMax, customX0 + 0.8);
            const { yMin, yMax } = preset.view;

            // 座標変換ヘルパー
            const toCanvasX = (x) => ((x - xMin) / (xMax - xMin)) * width;
            const toCanvasY = (y) => height - ((y - yMin) / (yMax - yMin)) * height;

            // プリセット変更時
            useEffect(() => {
                setCustomX0(preset.defaultX0);
                resetSimulation(preset.defaultX0);
            }, [selectedPresetKey]);

            // 初期値を変更して即座にシミュレーションリセット
            const handleX0Change = (newVal) => {
                const num = parseFloat(newVal);
                if (!isNaN(num)) {
                    setCustomX0(num);
                    resetSimulation(num);
                }
            };

            // 自動再生
            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(() => {
                        handleNextStep();
                    }, 1400);
                }
                return () => clearInterval(interval);
            }, [isPlaying, step, currentX, status]);

            const resetSimulation = (initX = customX0) => {
                setStep(-1);
                setCurrentX(initX);
                setHistory([]);
                setIsPlaying(false);
                setStatus('ready');
            };

            const handleNextStep = () => {
                if (status === 'converged' || status === 'zero_slope') {
                    setIsPlaying(false);
                    return;
                }

                const fx = preset.func(currentX);
                const dfx = preset.dfunc(currentX);

                // 傾きゼロ判定
                if (Math.abs(dfx) < 1e-12) {
                    setStatus('zero_slope');
                    setIsPlaying(false);
                    setHistory(prev => [...prev, {
                        step: Math.max(0, step + 1),
                        x: currentX,
                        fx: fx,
                        dfx: dfx,
                        nextX: NaN,
                        diff: NaN,
                        error: '傾きゼロ (ZeroDivisionError)'
                    }]);
                    setStep(prev => prev + 1);
                    return;
                }

                const nextX = currentX - fx / dfx;
                const diff = Math.abs(nextX - currentX);
                const currentStepNum = Math.max(0, step + 1);

                setHistory(prev => [...prev, {
                    step: currentStepNum,
                    x: currentX,
                    fx: fx,
                    dfx: dfx,
                    nextX: nextX,
                    diff: diff
                }]);

                // 収束判定 (倍精度限界または残差が極小)
                if (diff < 1e-10 || Math.abs(fx) < 1e-10) {
                    setStatus('converged');
                    setIsPlaying(false);
                } else {
                    setStatus('running');
                }

                setCurrentX(nextX);
                setStep(prev => prev + 1);
            };

            // Canvas 描画ロジック
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, width, height);

                // --- 1. グリッドと軸の描画 ---
                ctx.lineWidth = 1;

                // 軽いグリッド
                ctx.strokeStyle = '#f1f5f9';
                const xGridStep = (xMax - xMin) > 10 ? 2 : 1;
                for (let xVal = Math.ceil(xMin); xVal <= xMax; xVal += xGridStep) {
                    ctx.beginPath();
                    ctx.moveTo(toCanvasX(xVal), 0);
                    ctx.lineTo(toCanvasX(xVal), height);
                    ctx.stroke();
                }

                // X軸
                ctx.beginPath();
                ctx.moveTo(0, toCanvasY(0));
                ctx.lineTo(width, toCanvasY(0));
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Y軸 (範囲内にある場合)
                if (xMin <= 0 && xMax >= 0) {
                    ctx.beginPath();
                    ctx.moveTo(toCanvasX(0), 0);
                    ctx.lineTo(toCanvasX(0), height);
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // 目盛の数値
                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                for (let xVal = Math.ceil(xMin); xVal <= xMax; xVal += xGridStep) {
                    if (Math.abs(xVal) < 0.01) continue;
                    const cx = toCanvasX(xVal);
                    ctx.fillText(xVal.toString(), cx - 6, toCanvasY(0) + 14);
                }

                // 真の解 (roots) の位置を淡いグリーンでマーク
                preset.roots.forEach(r => {
                    if (r >= xMin && r <= xMax) {
                        ctx.beginPath();
                        ctx.arc(toCanvasX(r), toCanvasY(0), 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#10b981';
                        ctx.fill();
                    }
                });

                // --- 2. 関数曲線 f(x) の描画 ---
                ctx.beginPath();
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 2.5;
                let started = false;
                for (let px = 0; px <= width; px++) {
                    const x = xMin + (px / width) * (xMax - xMin);
                    const y = preset.func(x);
                    if (y >= yMin - 50 && y <= yMax + 50) {
                        const cy = toCanvasY(y);
                        if (!started) {
                            ctx.moveTo(px, cy);
                            started = true;
                        } else {
                            ctx.lineTo(px, cy);
                        }
                    } else {
                        started = false;
                    }
                }
                ctx.stroke();

                // --- 3. 過去のステップの軌跡（薄いグレーの点線） ---
                if (history.length > 0) {
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
                    ctx.setLineDash([3, 3]);
                    ctx.lineWidth = 1;
                    for (let i = 0; i < history.length - 1; i++) {
                        const h = history[i];
                        if (h.x >= xMin && h.x <= xMax && !isNaN(h.nextX)) {
                            ctx.beginPath();
                            ctx.moveTo(toCanvasX(h.x), toCanvasY(h.fx));
                            ctx.lineTo(toCanvasX(h.nextX), toCanvasY(0));
                            ctx.stroke();
                        }
                    }
                    ctx.setLineDash([]);
                }

                // --- 4. 現在のステップの要素を描画 ---
                if (step >= 0 && history.length > 0) {
                    const latest = history[history.length - 1];
                    const x_k = latest.x;
                    const fx_k = latest.fx;
                    const dfx_k = latest.dfx;
                    const nextX = latest.nextX;

                    const cx_k = toCanvasX(x_k);
                    const cy_k = toCanvasY(fx_k);

                    // A. 点 (x_k, fx_k) から x 軸への垂線（青の破線）
                    ctx.beginPath();
                    ctx.setLineDash([4, 4]);
                    ctx.moveTo(cx_k, toCanvasY(0));
                    ctx.lineTo(cx_k, cy_k);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // B. 接線の描画（赤の実線）
                    if (!isNaN(nextX)) {
                        ctx.beginPath();
                        ctx.strokeStyle = '#dc2626';
                        ctx.lineWidth = 2;

                        const leftY = dfx_k * (xMin - x_k) + fx_k;
                        const rightY = dfx_k * (xMax - x_k) + fx_k;
                        ctx.moveTo(toCanvasX(xMin), toCanvasY(leftY));
                        ctx.lineTo(toCanvasX(xMax), toCanvasY(rightY));
                        ctx.stroke();

                        // C. 次の交点 x_{k+1} のハイライト（緑の四角）
                        const c_nextX = toCanvasX(nextX);
                        if (c_nextX >= 0 && c_nextX <= width) {
                            ctx.beginPath();
                            ctx.rect(c_nextX - 6, toCanvasY(0) - 6, 12, 12);
                            ctx.fillStyle = '#16a34a';
                            ctx.fill();
                            ctx.strokeStyle = '#ffffff';
                            ctx.lineWidth = 2;
                            ctx.stroke();

                            ctx.fillStyle = '#16a34a';
                            ctx.font = 'bold 13px sans-serif';
                            ctx.fillText(`x_${step+1} = ${nextX.toFixed(3)}`, c_nextX - 25, toCanvasY(0) + 22);
                        }
                    } else if (status === 'zero_slope') {
                        // 傾きゼロ：水平接線
                        ctx.beginPath();
                        ctx.strokeStyle = '#dc2626';
                        ctx.lineWidth = 2.5;
                        ctx.moveTo(0, cy_k);
                        ctx.lineTo(width, cy_k);
                        ctx.stroke();
                    }

                    // D. 現在の点 (x_k, fx_k)（赤丸）
                    if (cx_k >= 0 && cx_k <= width) {
                        ctx.beginPath();
                        ctx.arc(cx_k, cy_k, 6, 0, Math.PI * 2);
                        ctx.fillStyle = '#dc2626';
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.fillStyle = '#1e293b';
                        ctx.font = 'bold 13px sans-serif';
                        ctx.fillText(`(x_${step}, f(x_${step}))`, cx_k + 8, cy_k - 8);
                    }

                    // E. X 軸上の現在値 x_k（青丸）
                    if (cx_k >= 0 && cx_k <= width) {
                        ctx.beginPath();
                        ctx.arc(cx_k, toCanvasY(0), 5, 0, Math.PI * 2);
                        ctx.fillStyle = '#2563eb';
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                } else if (step === -1) {
                    // 開始前：初期値 x0 の位置をマーク
                    const cx0 = toCanvasX(currentX);
                    const cy0 = toCanvasY(preset.func(currentX));

                    ctx.beginPath();
                    ctx.setLineDash([4, 4]);
                    ctx.moveTo(cx0, toCanvasY(0));
                    ctx.lineTo(cx0, cy0);
                    ctx.strokeStyle = '#94a3b8';
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.beginPath();
                    ctx.arc(cx0, toCanvasY(0), 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#2563eb';
                    ctx.fill();

                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillText(`初期値 x₀ = ${currentX.toFixed(2)}`, cx0 + 8, toCanvasY(0) - 10);
                }

            }, [currentX, step, history, selectedPresetKey, status, customX0, xMin, xMax]);

            // 状況説明メッセージ
            const getStatusMessage = () => {
                if (status === 'zero_slope') {
                    return `【❌ 傾きゼロで計算停止】点 x = ${currentX.toFixed(4)} で導関数 f'(x) = 0（水平な接線）となりました。接線が x 軸と交差できないため、分母がゼロになりプログラムがクラッシュします（ゼロ除算エラー）。`;
                }
                if (status === 'converged') {
                    const latest = history[history.length - 1];
                    return `【🎉 収束完了！】わずか ${history.length} 回のステップで誤差が限界（10⁻¹⁰ 未満）に到達しました。求まった解: x* ≈ ${currentX.toFixed(6)} （そのときの f(x) = ${preset.func(currentX).toExponential(3)}）。まさに二次収束の驚異的な速さです！`;
                }
                if (step === -1) {
                    return `初期推測値 x₀ = ${currentX.toFixed(2)} を設定しました。「1ステップ進む」を押すと、この点における関数の接線を引き、x 軸との交点へとジャンプします。初期値はスライダーまたは数値入力で自由に変更できます。`;
                }
                if (history.length > 0) {
                    const latest = history[history.length - 1];
                    const jumpDist = Math.abs(latest.nextX - latest.x);
                    if (jumpDist > 5) {
                        return `【⚠️ 遠方への吹き飛び発生！】現在値 x = ${latest.x.toFixed(4)} は傾きが極小（f' ≈ ${latest.dfx.toFixed(4)}）だったため、接線が遥か遠くの x ≈ ${latest.nextX.toFixed(2)} まで吹き飛ばされました！これこそが初期値の選び方によるニュートン法の落とし穴です。`;
                    }
                    return `Step ${latest.step}: 現在地 x = ${latest.x.toFixed(4)}（f(x) = ${latest.fx.toFixed(4)}）で引いた接線の傾きは f'(x) = ${latest.dfx.toFixed(4)} です。接線と x 軸の交点 x = ${latest.nextX.toFixed(5)} へジャンプしました（変化量: ${latest.diff.toExponential(2)}）。`;
                }
                return 'シミュレーション準備完了';
            };

            const latestHistory = history.length > 0 ? history[history.length - 1] : null;

            return (
                <div className="flex flex-col items-center p-6 max-w-4xl mx-auto bg-white rounded-xl shadow-lg my-6">
                    {/* ヘッダー：1行に収まるように文字サイズ調整 */}
                    <div className="w-full flex flex-col md:flex-row md:items-center justify-between border-b pb-3 mb-4 gap-2">
                        <div className="min-w-0">
                            <h1 className="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2 whitespace-nowrap">
                                ニュートン法 (Newton-Raphson法)
                                <span className="text-xs font-normal px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 whitespace-nowrap">二次収束アルゴリズム</span>
                            </h1>
                            <p className="text-xs text-gray-500 mt-0.5">関数の接線（微分）を利用して超高速に方程式の解を求める</p>
                        </div>
                        <div className="text-xs text-gray-500 bg-gray-50 px-2.5 py-1.5 rounded border font-mono whitespace-nowrap self-start md:self-auto">
                            更新式: x<sub>k+1</sub> = x<sub>k</sub> - f(x<sub>k</sub>) / f'(x<sub>k</sub>)
                        </div>
                    </div>

                    {/* 検証ケース選択タブ */}
                    <div className="w-full mb-3">
                        <label className="text-xs font-bold text-gray-600 block mb-1.5">検証ケースを選択：</label>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                            {Object.values(PRESETS).map(p => (
                                <button
                                    key={p.id}
                                    onClick={() => setSelectedPresetKey(p.id)}
                                    className={`p-2.5 text-left rounded-lg border text-sm transition-all ${
                                        selectedPresetKey === p.id 
                                            ? 'border-blue-600 bg-blue-50/50 shadow-sm ring-2 ring-blue-500/20' 
                                            : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                                    }`}
                                >
                                    <div className="font-bold text-gray-800 text-xs mb-1 truncate">{p.name}</div>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded border font-semibold ${p.badgeColor}`}>
                                        {p.badge}
                                    </span>
                                </button>
                            ))}
                        </div>
                        <div className="text-xs text-gray-600 bg-slate-50 p-2.5 rounded mt-2 border border-slate-200">
                            <strong>対象関数:</strong> <code className="text-blue-700 font-bold">{preset.formula}</code>　
                            <strong>導関数:</strong> <code className="text-purple-700 font-bold">{preset.dFormula}</code>　
                            <span className="text-gray-500">| {preset.desc}</span>
                        </div>
                    </div>

                    {/* 初期値の自由変更バー */}
                    <div className="w-full mb-4 flex flex-wrap items-center gap-3 p-2.5 bg-blue-50/60 rounded-lg border border-blue-100">
                        <div className="flex items-center gap-1.5">
                            <label className="text-xs font-bold text-blue-900 whitespace-nowrap">初期値 x₀ を自由指定:</label>
                            <input 
                                type="number" 
                                step="0.01" 
                                value={customX0} 
                                onChange={(e) => handleX0Change(e.target.value)}
                                className="w-24 px-2 py-1 text-sm border border-blue-200 rounded font-mono font-bold text-blue-700 bg-white shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>
                        <div className="flex-1 min-w-[180px] flex items-center gap-2">
                            <span className="text-[11px] text-gray-400 font-mono">{preset.sliderMin}</span>
                            <input 
                                type="range" 
                                min={preset.sliderMin} 
                                max={preset.sliderMax} 
                                step="0.01" 
                                value={customX0} 
                                onChange={(e) => handleX0Change(e.target.value)}
                                className="w-full accent-blue-600 cursor-pointer"
                            />
                            <span className="text-[11px] text-gray-400 font-mono">{preset.sliderMax}</span>
                        </div>
                        <button 
                            onClick={() => handleX0Change(preset.defaultX0)}
                            className="px-2.5 py-1 text-xs bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 rounded shadow-sm transition-colors whitespace-nowrap font-medium"
                            title="ケース推奨の初期値に戻す"
                        >
                            推奨値 ({preset.defaultX0})
                        </button>
                    </div>

                    {/* グラフ描画 Canvas */}
                    <div className="relative border-2 border-gray-200 rounded-lg overflow-hidden mb-4 bg-white shadow-inner">
                        <canvas 
                            ref={canvasRef} 
                            width={width} 
                            height={height}
                            className="w-full h-auto block"
                        />

                        {/* 状態表示オーバーレイ */}
                        <div className="absolute top-3 left-3 bg-white/95 p-3 rounded-lg shadow-md backdrop-blur-sm border border-gray-200 text-xs min-w-[210px]">
                            <div className="font-bold text-gray-700 mb-1.5 border-b pb-1 flex justify-between items-center">
                                <span>{step < 0 ? "初期状態" : `反復ステップ: ${step}`}</span>
                                <span className={`px-1.5 py-0.5 rounded text-[10px] ${
                                    status === 'converged' ? 'bg-green-100 text-green-700' :
                                    status === 'zero_slope' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'
                                }`}>
                                    {status === 'converged' ? '収束' : status === 'zero_slope' ? 'エラー' : '探索中'}
                                </span>
                            </div>
                            
                            <div className="space-y-1 font-mono">
                                <div className="text-blue-600">
                                    現在値 x: <span className="font-bold text-sm">{currentX.toFixed(6)}</span>
                                </div>
                                <div className="text-gray-600">
                                    f(x): <span>{preset.func(currentX).toFixed(6)}</span>
                                </div>
                                <div className="text-purple-600">
                                    傾き f'(x): <span>{preset.dfunc(currentX).toFixed(6)}</span>
                                </div>
                                {latestHistory && !isNaN(latestHistory.nextX) && (
                                    <div className="text-green-600 font-bold pt-1 border-t border-gray-100">
                                        次の値: <span>{latestHistory.nextX.toFixed(6)}</span>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 凡例オーバーレイ */}
                        <div className="absolute bottom-3 right-3 bg-white/90 px-2.5 py-1.5 rounded shadow text-[11px] border border-gray-200 flex items-center gap-3">
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span> 曲線 f(x)</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-0.5 bg-red-600"></span> 接線</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-red-600"></span> 現在地</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-green-600"></span> 次の推測点</span>
                        </div>
                    </div>

                    {/* ステータスメッセージ */}
                    <div className={`w-full p-3.5 rounded-lg mb-5 border min-h-[72px] flex items-center ${
                        status === 'converged' ? 'bg-green-50 border-green-200 text-green-900' :
                        status === 'zero_slope' ? 'bg-red-50 border-red-200 text-red-900' :
                        'bg-blue-50 border-blue-200 text-blue-900'
                    }`}>
                        <div className="w-full">
                            <div className="text-xs font-bold uppercase tracking-wider mb-0.5 opacity-80">アルゴリズムの挙動解説</div>
                            <p className="text-sm font-medium leading-relaxed">
                                {getStatusMessage()}
                            </p>
                        </div>
                    </div>

                    {/* 操作ボタン */}
                    <div className="flex flex-wrap items-center justify-center gap-3 mb-6">
                        <button 
                            onClick={() => resetSimulation()}
                            className="flex items-center gap-1.5 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors text-sm font-semibold border border-gray-300"
                        >
                            <RefreshIcon /> 最初から
                        </button>
                        
                        <button 
                            onClick={() => setIsPlaying(!isPlaying)}
                            disabled={status === 'converged' || status === 'zero_slope'}
                            className={`flex items-center gap-2 px-6 py-2 rounded-lg transition-colors font-bold text-white shadow-sm text-sm ${
                                isPlaying ? 'bg-amber-500 hover:bg-amber-600' : 
                                (status === 'converged' || status === 'zero_slope') ? 'bg-gray-400 cursor-not-allowed' :
                                'bg-green-600 hover:bg-green-700'
                            }`}
                        >
                            {isPlaying ? <><PauseIcon /> 一時停止</> : <><PlayIcon /> 自動再生</>}
                        </button>

                        <button 
                            onClick={handleNextStep}
                            disabled={isPlaying || status === 'converged' || status === 'zero_slope'}
                            className="flex items-center gap-2 px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-lg transition-all font-bold shadow-md text-sm active:scale-95"
                        >
                            {step < 0 ? "接線を引く (開始)" : "次の接線へジャンプ"} <ChevronRightIcon />
                        </button>
                    </div>

                    {/* 反復履歴テーブル */}
                    <div className="w-full text-xs text-gray-600 border-t pt-4">
                        <div className="flex justify-between items-center mb-2">
                            <h4 className="font-bold text-gray-700 text-sm">反復計算の履歴ログ</h4>
                            <span className="text-[11px] text-gray-400">ステップごとに有効数字が約2倍に増加</span>
                        </div>
                        <div className="overflow-x-auto border rounded-lg">
                            <table className="min-w-full text-left bg-white">
                                <thead className="bg-gray-50 border-b text-gray-500">
                                    <tr>
                                        <th className="py-2 px-3">Step</th>
                                        <th className="py-2 px-3">現在値 x_k</th>
                                        <th className="py-2 px-3">f(x_k)</th>
                                        <th className="py-2 px-3">傾き f'(x_k)</th>
                                        <th className="py-2 px-3">次の値 x_{'{k+1}'}</th>
                                        <th className="py-2 px-3">変化量 |Δx|</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100 font-mono">
                                    {history.length === 0 ? (
                                        <tr><td colSpan="6" className="py-4 text-center text-gray-400">まだ反復計算が行われていません</td></tr>
                                    ) : (
                                        history.map((h, i) => (
                                            <tr key={i} className={i === history.length - 1 ? 'bg-blue-50/50 font-bold' : ''}>
                                                <td className="py-1.5 px-3 text-gray-500">{h.step}</td>
                                                <td className="py-1.5 px-3 text-blue-600">{h.x.toFixed(6)}</td>
                                                <td className="py-1.5 px-3">{h.fx.toExponential(4)}</td>
                                                <td className="py-1.5 px-3 text-purple-600">{h.dfx.toFixed(4)}</td>
                                                <td className="py-1.5 px-3 text-green-600">{isNaN(h.nextX) ? '計算不能' : h.nextX.toFixed(6)}</td>
                                                <td className="py-1.5 px-3 text-gray-500">{isNaN(h.diff) ? '-' : h.diff.toExponential(2)}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NewtonMethod />);
    </script>
</body>
</html>
